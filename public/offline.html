<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - SPMB</title>
    <style>
        body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
            background:linear-gradient(135deg,#1a5f2a,#2e8b57);color:#fff;
            min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
        .box{max-width:360px}
        .ic{font-size:4rem;margin-bottom:1rem}
        h1{font-size:1.4rem;margin:.25rem 0}
        p{opacity:.85;line-height:1.5}
        button{margin-top:1.5rem;background:#fff;color:#1a5f2a;border:0;border-radius:.6rem;
            padding:.7rem 1.4rem;font-weight:600;font-size:1rem}
    </style>
</head>
<body>
    <div class="box">
        <div class="ic">📶</div>
        <h1>Anda Sedang Offline</h1>
        <p>Tidak ada koneksi internet. Periksa jaringan Anda, lalu coba lagi. Data pendaftaran hanya bisa dikirim saat online.</p>
        <button onclick="location.reload()">Coba Lagi</button>
    </div>
</body>
</html>
